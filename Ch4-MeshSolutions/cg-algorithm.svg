<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440">
<style>text{font-family:sans-serif;}</style>
<rect x="20" y="10" width="520" height="420" fill="#f8f8f8" stroke="currentColor" stroke-width="1.5" rx="8"/>
<text x="280" y="38" text-anchor="middle" style="font-size:14px;fill:currentColor;font-weight:bold;">Conjugate Gradient Algorithm</text>
<line x1="30" y1="48" x2="530" y2="48" stroke="#aaaaaa" stroke-width="1"/>
<text x="50" y="68" text-anchor="start" style="font-family:monospace;font-size:12px;fill:currentColor;">r⁻⁰⁾ = Ax⁻⁰⁾ − b</text>
<text x="50" y="87" text-anchor="start" style="font-family:monospace;font-size:12px;fill:currentColor;">d⁻⁰⁾ = −r⁻⁰⁾</text>
<text x="50" y="106" text-anchor="start" style="font-family:monospace;font-size:12px;fill:currentColor;">δ⁻⁰⁾ = r⁻⁰⁾ᵀ r⁻⁰⁾</text>
<text x="40" y="125" text-anchor="start" style="font-size:12px;fill:currentColor;font-weight:bold;">for m = 0, 1, 2, …</text>
<text x="70" y="144" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">u = Ad⁻ᵐ⁾</text>
<text x="70" y="163" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">λ_m = δ⁻ᵐ⁾ / (d⁻ᵐ⁾ᵀ u)   ← do locally then AllReduce</text>
<text x="70" y="182" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">x⁻ᵐ⁺¹⁾ = x⁻ᵐ⁾ + λ_m d⁻ᵐ⁾</text>
<text x="70" y="201" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">r⁻ᵐ⁺¹⁾ = r⁻ᵐ⁾ + λ_m u</text>
<text x="70" y="220" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">δ⁻ᵐ⁺¹⁾ = r⁻ᵐ⁺¹⁾ᵀ r⁻ᵐ⁺¹⁾   ← do locally then AllReduce</text>
<text x="70" y="239" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">if √δ⁻ᵐ⁺¹⁾ < tol: output x⁻ᵐ⁺¹⁾, stop</text>
<text x="70" y="258" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">α_m = δ⁻ᵐ⁺¹⁾ / δ⁻ᵐ⁾</text>
<text x="70" y="277" text-anchor="start" style="font-family:monospace;font-size:11px;fill:currentColor;">d⁻ᵐ⁺¹⁾ = −r⁻ᵐ⁺¹⁾ + α_m d⁻ᵐ⁾</text>
<line x1="30" y1="306" x2="530" y2="306" stroke="#aaaaaa" stroke-width="0.8"/>
<text x="40" y="324" text-anchor="start" style="font-size:12px;fill:currentColor;font-weight:bold;">Key properties:</text>
<text x="48" y="345" text-anchor="start" style="font-size:10px;fill:currentColor;">• A is sparse — write out the matrix-vector product explicitly</text>
<text x="48" y="361" text-anchor="start" style="font-size:10px;fill:currentColor;">• u = Ad⁻ᵐ⁾ is the main parallelizable kernel (like Jacobi iteration)</text>
<text x="48" y="377" text-anchor="start" style="font-size:10px;fill:currentColor;">• Dot products (δ, λ denominators) use MPI_Allreduce after local sum</text>
<text x="48" y="393" text-anchor="start" style="font-size:10px;fill:currentColor;">• Converges in at most n iterations (n = matrix dimension)</text>
<text x="48" y="409" text-anchor="start" style="font-size:10px;fill:currentColor;">• In practice, much fewer iterations for well-conditioned problems</text>
</svg>
