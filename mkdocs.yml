site_name: Using MPI for Scientific Computing - Short Course
site_url: https://CDenniston.github.io/MPI_Short_Course
theme: material

nav:
  - Home: index.md
  - Introduction: Ch1-Intro/Ch1-Intro_1.md
  - Message Passing: "Ch2-Message Passing/Ch2-Message_Passing.md"
  - Matrix Vector Operations: "Ch3-MatrixVector Operations/Ch3-Matrix-Vector_Operations.md"
  - Mesh Solutions: Ch4-MeshSolutions/Ch4-MeshSolutions.md
  
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences