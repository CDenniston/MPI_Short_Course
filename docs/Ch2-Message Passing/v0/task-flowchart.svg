<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="580" height="500" viewBox="0 0 580 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/>
    </marker>
    <marker id="arrl" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Column labels -->
  <text x="145" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">nid = 0  (Boss)</text>
  <text x="435" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">nid ≠ 0  (Workers)</text>

  <!-- Column divider -->
  <line x1="290" y1="25" x2="290" y2="490" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Left loop box -->
  <rect x="65" y="30" width="160" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="50" text-anchor="middle" font-family="monospace" font-size="12">task = 1..10</text>

  <!-- Left exit arrow: >10 → next loop -->
  <line x1="225" y1="45" x2="248" y2="45" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="237" y="40" text-anchor="middle" font-family="sans-serif" font-size="9">&gt;10</text>
  <rect x="248" y="33" width="68" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.0"/>
  <text x="282" y="48" text-anchor="middle" font-family="sans-serif" font-size="9">next loop</text>

  <!-- Right loop box -->
  <rect x="355" y="30" width="160" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="50" text-anchor="middle" font-family="monospace" font-size="12">task = 1..10</text>

  <!-- Right exit arrow: >10 → next loop -->
  <line x1="355" y1="45" x2="330" y2="45" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrl)"/>
  <text x="343" y="40" text-anchor="middle" font-family="sans-serif" font-size="9">&gt;10</text>

  <!-- Down arrows (≤10 paths) -->
  <line x1="145" y1="60" x2="145" y2="83" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="74" font-family="sans-serif" font-size="9">≤10</text>
  <line x1="435" y1="60" x2="435" y2="83" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="74" font-family="sans-serif" font-size="9">≤10</text>

  <!-- Compute node boxes -->
  <rect x="65" y="83" width="160" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="101" text-anchor="middle" font-family="monospace" font-size="11">compute node</text>

  <rect x="355" y="83" width="160" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="101" text-anchor="middle" font-family="monospace" font-size="11">compute node</text>

  <!-- Down to diamonds -->
  <line x1="145" y1="111" x2="145" y2="135" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="435" y1="111" x2="435" y2="135" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision diamond: node=0? (left) -->
  <polygon points="145,135 200,162 145,189 90,162" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="157" text-anchor="middle" font-family="sans-serif" font-size="11">node = 0?</text>
  <text x="145" y="170" text-anchor="middle" font-family="sans-serif" font-size="9">(my task, I'm Boss)</text>

  <!-- Decision diamond: node=nid? (right) -->
  <polygon points="435,135 490,162 435,189 380,162" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="157" text-anchor="middle" font-family="sans-serif" font-size="11">node = nid?</text>
  <text x="435" y="170" text-anchor="middle" font-family="sans-serif" font-size="9">(my task?)</text>

  <!-- Left diamond: Y path (down) -->
  <line x1="145" y1="189" x2="145" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="202" font-family="sans-serif" font-size="9">Y</text>

  <!-- Left diamond: N path (right to Recv) -->
  <line x1="200" y1="162" x2="225" y2="162" stroke="currentColor" stroke-width="1.5"/>
  <line x1="225" y1="162" x2="225" y2="250" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="157" font-family="sans-serif" font-size="9">N</text>

  <!-- Do task (node=0, Boss does it) -->
  <rect x="65" y="212" width="160" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="230" text-anchor="middle" font-family="monospace" font-size="11">Do task (no send)</text>

  <!-- Boss Y path: down to output -->
  <line x1="145" y1="240" x2="145" y2="285" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N path: Recv box -->
  <rect x="190" y="250" width="160" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="270" y="265" text-anchor="middle" font-family="monospace" font-size="10">MPI_Recv (any source)</text>
  <text x="270" y="278" text-anchor="middle" font-family="monospace" font-size="10">wait to complete</text>

  <!-- N path: Recv → output -->
  <line x1="270" y1="286" x2="270" y2="305" stroke="currentColor" stroke-width="1.5"/>
  <line x1="270" y1="305" x2="155" y2="305" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrl)"/>

  <!-- Output box -->
  <rect x="65" y="285" width="160" height="30" rx="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="145" y="304" text-anchor="middle" font-family="monospace" font-size="11">printf(...)</text>

  <!-- Loop back arrow (left) -->
  <line x1="65" y1="300" x2="30" y2="300" stroke="currentColor" stroke-width="1.5"/>
  <line x1="30" y1="300" x2="30" y2="45" stroke="currentColor" stroke-width="1.5"/>
  <line x1="30" y1="45" x2="65" y2="45" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="18" y="175" text-anchor="middle" font-family="sans-serif" font-size="9" transform="rotate(-90,18,175)">loop back</text>

  <!-- Right diamond: Y path (down-left) -->
  <line x1="435" y1="189" x2="435" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="202" font-family="sans-serif" font-size="9">Y</text>

  <!-- Right diamond: N path (right → loop back) -->
  <line x1="490" y1="162" x2="555" y2="162" stroke="currentColor" stroke-width="1.5"/>
  <line x1="555" y1="162" x2="555" y2="45" stroke="currentColor" stroke-width="1.5"/>
  <line x1="555" y1="45" x2="515" y2="45" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrl)"/>
  <text x="497" y="157" font-family="sans-serif" font-size="9">N</text>

  <!-- Do task + MPI_Send box -->
  <rect x="355" y="212" width="160" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="435" y="227" text-anchor="middle" font-family="monospace" font-size="11">Do task</text>
  <text x="435" y="241" text-anchor="middle" font-family="monospace" font-size="11">MPI_Send task → Boss</text>
  <text x="435" y="252" text-anchor="middle" font-family="sans-serif" font-size="9">(blocking: wait for receipt)</text>

  <!-- MPI_Send arrow (right→left, to Recv) -->
  <line x1="355" y1="233" x2="350" y2="233" stroke="currentColor" stroke-width="1.5"/>
  <line x1="350" y1="233" x2="350" y2="268" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrl)"/>

  <!-- Workers loop back arrow -->
  <line x1="435" y1="256" x2="435" y2="310" stroke="currentColor" stroke-width="1.5"/>
  <line x1="435" y1="310" x2="555" y2="310" stroke="currentColor" stroke-width="1.5"/>
  <line x1="555" y1="310" x2="555" y2="45" stroke="currentColor" stroke-width="1.5"/>
  <!-- (already drawn above, shared with N path) -->

  <!-- Note about MPI_Send to self -->
  <rect x="305" y="370" width="245" height="60" rx="4" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="427" y="386" text-anchor="middle" font-family="sans-serif" font-size="9" font-style="italic">Why not just send to self?</text>
  <text x="427" y="399" text-anchor="middle" font-family="sans-serif" font-size="9">MPI_Send to self is non-blocking</text>
  <text x="427" y="412" text-anchor="middle" font-family="sans-serif" font-size="9">— proceeds without waiting for receipt.</text>
  <text x="427" y="425" text-anchor="middle" font-family="sans-serif" font-size="9">Some implementations have a bug and block.</text>

  <!-- MPI_Barrier note -->
  <rect x="30" y="370" width="258" height="46" rx="4" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="158" y="386" text-anchor="middle" font-family="sans-serif" font-size="9">Add between loops if tasks 1–10</text>
  <text x="158" y="399" text-anchor="middle" font-family="monospace" font-size="9">MPI_Barrier(MPI_COMM_WORLD);</text>
  <text x="158" y="412" text-anchor="middle" font-family="sans-serif" font-size="9">must complete before tasks 11–20 begin.</text>
</svg>
