<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- CPU boxes -->
  <rect x="40"  y="20" width="80" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="80"  y="45" text-anchor="middle" font-family="monospace" font-size="13">CPU 1</text>

  <rect x="170" y="20" width="80" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="210" y="45" text-anchor="middle" font-family="monospace" font-size="13">CPU 2</text>

  <rect x="300" y="20" width="80" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="340" y="45" text-anchor="middle" font-family="monospace" font-size="13">CPU 3</text>

  <!-- Bidirectional arrows down to memory -->
  <line x1="80"  y1="60" x2="80"  y2="115" stroke="currentColor" stroke-width="1.5"
        marker-end="url(#arr)" marker-start="url(#arrr)"/>
  <line x1="210" y1="60" x2="210" y2="115" stroke="currentColor" stroke-width="1.5"
        marker-end="url(#arr)" marker-start="url(#arrr)"/>
  <line x1="340" y1="60" x2="340" y2="115" stroke="currentColor" stroke-width="1.5"
        marker-end="url(#arr)" marker-start="url(#arrr)"/>

  <!-- Shared memory box -->
  <rect x="30" y="115" width="360" height="45" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="210" y="143" text-anchor="middle" font-family="monospace" font-size="13">memory</text>
</svg>
