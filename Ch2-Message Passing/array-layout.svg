<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="90" viewBox="0 0 420 90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 1D contiguous array memory layout -->

  <!-- Address label -->
  <text x="10" y="14" font-family="sans-serif" font-size="11" font-style="italic">address →</text>

  <!-- Array cells -->
  <rect x="10"  y="22" width="55" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="37"  y="44" text-anchor="middle" font-family="monospace" font-size="13">a[0]</text>

  <rect x="65"  y="22" width="55" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="92"  y="44" text-anchor="middle" font-family="monospace" font-size="13">a[1]</text>

  <rect x="120" y="22" width="55" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="147" y="44" text-anchor="middle" font-family="monospace" font-size="13">a[2]</text>

  <rect x="175" y="22" width="55" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="202" y="44" text-anchor="middle" font-family="monospace" font-size="13">a[3]</text>

  <!-- Ellipsis -->
  <text x="255" y="44" text-anchor="middle" font-family="sans-serif" font-size="18">…</text>

  <rect x="285" y="22" width="70" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" font-family="monospace" font-size="13">a[n-1]</text>

  <!-- Index labels below -->
  <text x="37"  y="72" text-anchor="middle" font-family="monospace" font-size="10">0</text>
  <text x="92"  y="72" text-anchor="middle" font-family="monospace" font-size="10">1</text>
  <text x="147" y="72" text-anchor="middle" font-family="monospace" font-size="10">2</text>
  <text x="202" y="72" text-anchor="middle" font-family="monospace" font-size="10">3</text>
  <text x="320" y="72" text-anchor="middle" font-family="monospace" font-size="10">n−1</text>

  <!-- index label -->
  <text x="10" y="72" font-family="sans-serif" font-size="10" font-style="italic">index:</text>
</svg>
