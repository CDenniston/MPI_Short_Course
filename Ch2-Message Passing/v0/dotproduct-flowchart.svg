<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="530" height="520" viewBox="0 0 530 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/>
    </marker>
    <marker id="arrl" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Column labels -->
  <text x="135" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Boss (node 0)</text>
  <text x="395" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Workers (nodes 1 … NProcs−1)</text>

  <!-- Column divider -->
  <line x1="265" y1="25" x2="265" y2="505" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- START oval -->
  <ellipse cx="135" cy="45" rx="60" ry="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="50" text-anchor="middle" font-family="sans-serif" font-size="12">Start</text>

  <!-- Boss: read n, a, b -->
  <line x1="135" y1="63" x2="135" y2="83" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="55" y="83" width="160" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="97" text-anchor="middle" font-family="monospace" font-size="11">Open DotData.txt</text>
  <text x="135" y="111" text-anchor="middle" font-family="monospace" font-size="11">ReadArrays → a[], b[]</text>

  <!-- Boss: down to Bcast -->
  <line x1="135" y1="123" x2="135" y2="148" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MPI_Bcast n row -->
  <rect x="55"  y="148" width="160" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="135" y="166" text-anchor="middle" font-family="monospace" font-size="11">MPI_Bcast n →</text>

  <rect x="315" y="148" width="160" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="395" y="166" text-anchor="middle" font-family="monospace" font-size="11">← MPI_Bcast n</text>

  <line x1="215" y1="162" x2="315" y2="162" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Down arrows to Send/Recv -->
  <line x1="135" y1="176" x2="135" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="176" x2="395" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MPI_Send / MPI_Recv row -->
  <rect x="55"  y="200" width="160" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="135" y="215" text-anchor="middle" font-family="monospace" font-size="11">MPI_Send chunk of</text>
  <text x="135" y="229" text-anchor="middle" font-family="monospace" font-size="11">a[], b[] to each i</text>

  <rect x="315" y="200" width="160" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="395" y="215" text-anchor="middle" font-family="monospace" font-size="11">MPI_Recv chunk of</text>
  <text x="395" y="229" text-anchor="middle" font-family="monospace" font-size="11">a[], b[] from Boss</text>

  <!-- Send arrows (multiple, indicating loop) -->
  <line x1="215" y1="214" x2="315" y2="214" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="215" y1="224" x2="315" y2="224" stroke="currentColor" stroke-width="1.0" stroke-dasharray="2,2"/>

  <!-- Down arrows to local dot product -->
  <line x1="135" y1="240" x2="135" y2="265" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="240" x2="395" y2="265" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- local dot product boxes -->
  <rect x="55"  y="265" width="160" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="280" text-anchor="middle" font-family="monospace" font-size="11">local_sum = a[0..size-1]</text>
  <text x="135" y="294" text-anchor="middle" font-family="monospace" font-size="11">        · b[0..size-1]</text>

  <rect x="315" y="265" width="160" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="395" y="280" text-anchor="middle" font-family="monospace" font-size="11">local_sum = a[0..size-1]</text>
  <text x="395" y="294" text-anchor="middle" font-family="monospace" font-size="11">        · b[0..size-1]</text>

  <!-- Down to Reduce -->
  <line x1="135" y1="305" x2="135" y2="330" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="305" x2="395" y2="330" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MPI_Reduce row -->
  <rect x="55"  y="330" width="160" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="135" y="349" text-anchor="middle" font-family="monospace" font-size="11">MPI_Reduce → global_sum</text>

  <rect x="315" y="330" width="160" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="395" y="349" text-anchor="middle" font-family="monospace" font-size="11">MPI_Reduce (send)</text>

  <!-- Reduce arrow right→left -->
  <line x1="315" y1="345" x2="215" y2="345" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrl)"/>

  <!-- Boss: down to print -->
  <line x1="135" y1="360" x2="135" y2="385" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Boss: print result -->
  <rect x="55" y="385" width="160" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="399" text-anchor="middle" font-family="monospace" font-size="11">cout &lt;&lt; "Inner product"</text>
  <text x="135" y="413" text-anchor="middle" font-family="monospace" font-size="11">&lt;&lt; global_sum</text>

  <!-- Boss: down to Stop -->
  <line x1="135" y1="421" x2="135" y2="448" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <ellipse cx="135" cy="466" rx="60" ry="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="471" text-anchor="middle" font-family="sans-serif" font-size="12">Stop</text>

  <!-- Workers: down to Done -->
  <line x1="395" y1="360" x2="395" y2="450" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <ellipse cx="395" cy="468" rx="50" ry="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="395" y="473" text-anchor="middle" font-family="sans-serif" font-size="12">Done</text>
</svg>
