<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="530" height="430" viewBox="0 0 530 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/>
    </marker>
    <marker id="arrl" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Column labels -->
  <text x="135" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Boss (node 0)</text>
  <text x="395" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Workers (nodes 1 … NProcs−1)</text>

  <!-- Column divider -->
  <line x1="265" y1="25" x2="265" y2="415" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- START oval -->
  <ellipse cx="135" cy="48" rx="60" ry="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="53" text-anchor="middle" font-family="sans-serif" font-size="12">Start</text>

  <!-- Boss: read N -->
  <line x1="135" y1="68" x2="135" y2="88" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="58" y="88" width="154" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="102" text-anchor="middle" font-family="monospace" font-size="11">Open ln2data.txt</text>
  <text x="135" y="116" text-anchor="middle" font-family="monospace" font-size="11">fin &gt;&gt; N</text>

  <!-- Boss: down to Bcast -->
  <line x1="135" y1="124" x2="135" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MPI_Bcast row (dashed) -->
  <rect x="58"  y="150" width="154" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="135" y="169" text-anchor="middle" font-family="monospace" font-size="11">MPI_Bcast N →</text>

  <rect x="318" y="150" width="154" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="395" y="169" text-anchor="middle" font-family="monospace" font-size="11">← MPI_Bcast N</text>

  <!-- Bcast horizontal arrow -->
  <line x1="212" y1="165" x2="318" y2="165" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Down arrows to PartialSum -->
  <line x1="135" y1="180" x2="135" y2="205" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="180" x2="395" y2="205" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PartialSum boxes -->
  <rect x="58"  y="205" width="154" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="222" text-anchor="middle" font-family="monospace" font-size="11">PartialSum(N,</text>
  <text x="135" y="236" text-anchor="middle" font-family="monospace" font-size="11">MyID=0, NProcs)</text>
  <text x="135" y="243" text-anchor="middle" font-family="sans-serif" font-size="9">→ mysum</text>

  <rect x="318" y="205" width="154" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="395" y="222" text-anchor="middle" font-family="monospace" font-size="11">PartialSum(N,</text>
  <text x="395" y="236" text-anchor="middle" font-family="monospace" font-size="11">MyID, NProcs)</text>
  <text x="395" y="243" text-anchor="middle" font-family="sans-serif" font-size="9">→ mysum</text>

  <!-- Down arrows to Reduce -->
  <line x1="135" y1="249" x2="135" y2="274" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="249" x2="395" y2="274" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MPI_Reduce row (dashed) -->
  <rect x="58"  y="274" width="154" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="135" y="289" text-anchor="middle" font-family="monospace" font-size="11">MPI_Reduce → Gsum</text>

  <rect x="318" y="274" width="154" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="395" y="289" text-anchor="middle" font-family="monospace" font-size="11">MPI_Reduce (send)</text>

  <!-- Reduce horizontal arrow (right to left) -->
  <line x1="318" y1="289" x2="212" y2="289" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrl)"/>

  <!-- Boss: down to print -->
  <line x1="135" y1="304" x2="135" y2="328" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Boss: print result -->
  <rect x="58" y="328" width="154" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="342" text-anchor="middle" font-family="monospace" font-size="11">cout &lt;&lt; "ln(2) ≈ "</text>
  <text x="135" y="356" text-anchor="middle" font-family="monospace" font-size="11">&lt;&lt; Gsum</text>

  <!-- Boss: down to Stop -->
  <line x1="135" y1="364" x2="135" y2="390" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <ellipse cx="135" cy="408" rx="60" ry="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="413" text-anchor="middle" font-family="sans-serif" font-size="12">Stop</text>

  <!-- Workers: down to Done -->
  <line x1="395" y1="304" x2="395" y2="380" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <ellipse cx="395" cy="398" rx="50" ry="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="395" y="403" text-anchor="middle" font-family="sans-serif" font-size="12">Done</text>
</svg>
